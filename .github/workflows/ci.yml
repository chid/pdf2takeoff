name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  legend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/legend.mjs build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sample
      - run: npm run build
      - run: npm run cli -- info public/examples/sample-floor-plan.pdf
      - run: npm run cli -- scan public/examples/sample-floor-plan.pdf --page 1 --at 88.35,271.42
      - run: node scripts/mcp-smoke.mjs
      - run: node --experimental-strip-types scripts/roundtrip-check.mjs
      - run: npm run bench
      - run: node --experimental-strip-types scripts/check-revdiff.mjs
      - name: Smoke the takeoff spec runner
        run: |
          cat > /tmp/takeoff.yaml <<'EOF'
          source: public/examples/sample-floor-plan.pdf
          scale: 1:100
          counts:
            - {label: Downlight, page: 1, at: [88.35, 271.42]}
          exports:
            - {format: summary, out: /tmp/run.json}
          EOF
          npm run cli -- run /tmp/takeoff.yaml | grep -q '"found": 8'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
